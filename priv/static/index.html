<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loom Air</title>
<link rel="icon" href="favicon.svg">
<style>
  :root { color-scheme: dark; --bg:#0b0d10; --panel:#14171c; --line:#252a31; --fg:#e7e9ec; --dim:#8a929c;
          --me:#2b5cff; --op:#1d2229; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
               font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif; }
  body { display:flex; flex-direction:column; max-width:760px; margin:0 auto;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  .who { color:var(--dim); font-size:13px; }
  .pill { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:13px; padding:4px 10px;
          border-radius:999px; background:var(--panel); border:1px solid var(--line); white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .dot.ready { background:var(--ok); } .dot.warm { background:var(--warn); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  #tasks { padding:6px 16px; font-size:13px; color:var(--warn); border-bottom:1px solid var(--line); display:none; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:9px 13px; border-radius:16px; white-space:pre-wrap; word-break:break-word; }
  .heard { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
  .say { align-self:flex-start; background:var(--op); border-bottom-left-radius:4px; }
  .say.mute { opacity:.55; }
  .tag { display:inline-block; font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:6px;
         padding:0 5px; margin-right:6px; vertical-align:1px; }
  .tool { align-self:flex-start; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--dim);
          max-width:100%; white-space:pre-wrap; word-break:break-all; }
  .reply { align-self:stretch; background:var(--panel); border:1px solid var(--line); border-radius:12px;
           padding:10px 13px; font-size:14px; }
  .reply b { display:block; font-size:12px; color:var(--dim); font-weight:500; margin-bottom:4px; }
  .reply div { white-space:pre-wrap; max-height:9em; overflow:hidden; }
  .reply.open div { max-height:none; }
  .err { align-self:stretch; color:var(--bad); font-size:13px; }
  .sys { align-self:center; color:var(--dim); font-size:12px; }
  footer { padding:10px 12px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:flex-end; }
  #call { width:48px; height:48px; border-radius:50%; border:0; color:#fff; background:var(--ok); flex:none;
          display:grid; place-items:center; cursor:pointer; }
  #call.on { background:var(--bad); }
  #call svg { width:24px; height:24px; }
  #call.on svg { transform: rotate(135deg); }
  #text { flex:1; min-height:48px; max-height:140px; resize:none; border-radius:14px; border:1px solid var(--line);
          background:var(--panel); color:var(--fg); padding:12px 14px; font:inherit; }
  #text:disabled { opacity:.5; }
  #send { height:48px; padding:0 16px; border-radius:14px; border:0; background:var(--me); color:#fff; font:inherit;
          cursor:pointer; }
  #send:disabled { opacity:.4; }
  #speaking { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); font-size:12px; color:var(--dim);
              background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px 10px; display:none; }
</style>
</head>
<body>
<header>
  <h1>Loom Air</h1><span class="who" id="who"></span>
  <span class="pill"><span class="dot" id="dot"></span><span id="gpu">未连接</span></span>
</header>
<div id="tasks"></div>
<div id="log"></div>
<div id="speaking">正在播放…</div>
<footer>
  <button id="call" title="拨号"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></button>
  <textarea id="text" rows="1" placeholder="先拨号，再打字（假装是手机转录的话）" disabled></textarea>
  <button id="send" disabled>说</button>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
let ws, voice, inCall = false, ending = false;
let ctx, playhead = 0, sources = [], rate = 24000;
let ringBuf, noAnswerBuf, ring;

const GPU = { off: "GPU 关机", launching: "GPU 申请机器中", booting: "GPU 开机中", warming: "GPU 预热中", ready: "GPU 就绪" };

function add(cls, html) {
  const el = document.createElement("div");
  el.className = cls; el.innerHTML = html;
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.appendChild(el);
  if (stick) log.scrollTop = log.scrollHeight;
  return el;
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);

function connect() {
  const url = new URL("ws", location.href); url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(url); ws.binaryType = "arraybuffer";
  ws.onmessage = (e) => typeof e.data === "string" ? onMsg(JSON.parse(e.data)) : onPcm(e.data);
  ws.onclose = () => { setCall(false); $("gpu").textContent = "断开，重连中"; $("dot").className = "dot"; setTimeout(connect, 2000); };
}

async function load(path) {
  try { return await ctx.decodeAudioData(await (await fetch(path)).arrayBuffer()); }
  catch (e) { add("err", `${esc(path)} 加载失败`); }
}
async function loadAudio() {
  ringBuf ??= await load("ringback.wav");
  noAnswerBuf ??= await load(`clips/${voice}/no_answer.wav`);
}

// The ringback plays outside the speech timeline, and stops the moment the call is answered.
function startRing() {
  if (!ringBuf) return;
  ring = ctx.createBufferSource(); ring.buffer = ringBuf; ring.connect(ctx.destination); ring.start();
}
function stopRing() { if (ring) { try { ring.stop(); } catch {} ring = null; } }

function onMsg(m) {
  switch (m.type) {
    case "hello":
      voice = m.voice;
      $("who").textContent = `${m.operator ?? "Loom Air"} · ${m.voice}`;
      break;
    case "dialled": setCall(true); break;
    case "ringing": startRing(); add("sys", "正在呼叫…"); break;
    case "answered": stopRing(); setTalk(true); add("sys", "已接通"); break;
    case "no_answer":
      stopRing(); add("sys", "无人接听");
      if (noAnswerBuf) schedule(noAnswerBuf);
      whenQuiet(() => ws.send(JSON.stringify({ type: "hangup" })));
      break;
    case "ended": stopRing(); setCall(false); add("sys", "已挂断"); break;
    case "state": {
      $("gpu").textContent = GPU[m.tts] + (m.tts !== "ready" && m.up_s ? ` ${m.up_s}s` : "");
      $("dot").className = "dot " + (m.tts === "ready" ? "ready" : m.tts === "off" ? "" : "warm");
      const t = $("tasks");
      t.style.display = m.tasks.length ? "block" : "none";
      t.textContent = "Loom 正在处理：" + m.tasks.join("、");
      break;
    }
    case "heard": add("msg heard", esc(m.text)); break;
    case "say": add("msg say" + (m.spoken ? "" : " mute"), (m.spoken ? "" : `<span class="tag">未朗读</span>`) + esc(m.text)); break;
    case "tool": add("tool", `→ ${esc(m.name)} ${esc(JSON.stringify(m.input))}\n  ${esc(m.result)}`); break;
    case "loom_reply": {
      const el = add("reply", `<b>Loom 回复 · ${esc(m.title || m.session)}</b><div>${esc(m.text)}</div>`);
      el.onclick = () => el.classList.toggle("open");
      break;
    }
    case "speech": rate = m.rate; startSpeech(); break;
    case "speech_end": break;
    case "end": ending = true; whenQuiet(() => { if (ending) ws.send(JSON.stringify({ type: "hangup" })); }); break;
    case "error": add("err", esc(m.text)); break;
  }
}

// One timeline: speech chunks (and the no-answer announcement) are scheduled back to back in arrival order.
function schedule(buf) {
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
  playhead = Math.max(playhead, ctx.currentTime + 0.05);
  src.start(playhead); playhead += buf.duration;
  sources.push(src); src.onended = () => { sources = sources.filter((x) => x !== src); speakingUi(); };
  speakingUi();
}
function startSpeech() { if (playhead < ctx.currentTime) playhead = ctx.currentTime + 0.15; }
function onPcm(ab) {
  if (!ctx) return;
  const i16 = new Int16Array(ab), f = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f[i] = i16[i] / 32768;
  const buf = ctx.createBuffer(1, f.length, rate); buf.copyToChannel(f, 0); schedule(buf);
}
function speakingUi() { $("speaking").style.display = sources.length ? "block" : "none"; }
function whenQuiet(fn) { const wait = () => (sources.length || (ctx && playhead > ctx.currentTime)) ? setTimeout(wait, 200) : fn(); setTimeout(wait, 300); }
function stopAudio() { for (const s of sources) try { s.stop(); } catch {} sources = []; playhead = 0; speakingUi(); }

function setCall(on) {
  inCall = on; if (!on) { ending = false; setTalk(false); }
  $("call").classList.toggle("on", on); $("call").title = on ? "挂断" : "拨号";
}
// The text box opens once the call is answered: nothing said while it rings is heard.
function setTalk(on) {
  $("text").disabled = $("send").disabled = !on;
  if (on) $("text").focus();
}

$("call").onclick = async () => {
  if (!ctx) ctx = new AudioContext();
  await ctx.resume();
  await loadAudio();
  if (inCall) { stopRing(); stopAudio(); ws.send(JSON.stringify({ type: "hangup" })); }
  else ws.send(JSON.stringify({ type: "dial" }));
};
function say() {
  const t = $("text").value.trim(); if (!t || $("send").disabled) return;
  ws.send(JSON.stringify({ type: "heard", text: t })); $("text").value = "";
}
$("send").onclick = say;
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); say(); } });
connect();
</script>
</body>
</html>
